[project]
name = "hearthlands-mcp"
version = "0.1.0"
description = "MCP server connecting Claude to The Hearthlands Minecraft Paper server via its HTTP plugin API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "The Hearthlands" }]
keywords = ["mcp", "minecraft", "paper", "claude", "hearthlands"]

dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hearthlands-mcp = "hearthlands_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearthlands_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
